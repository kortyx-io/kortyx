name: kortyx-studio

x-api-env: &api-env
  DATABASE_URL: postgres://kortyx:kortyx@postgres:5432/kortyx
  KORTYX_API_KEY_PEPPER: ${KORTYX_API_KEY_PEPPER:-dev-insecure-change-me}

x-oss-keys: &oss-keys
  KORTYX_TELEMETRY_API_KEY: ${KORTYX_TELEMETRY_API_KEY:-ktyx_test_localtelemetry_oss-demo-telemetry-secret-change-me}
  KORTYX_STUDIO_API_KEY: ${KORTYX_STUDIO_API_KEY:-ktyx_test_localstudio_oss-demo-studio-secret-change-me}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kortyx
      POSTGRES_PASSWORD: kortyx
      POSTGRES_DB: kortyx
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kortyx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kortyx -d kortyx"]
      interval: 2s
      timeout: 5s
      retries: 30

  db-init:
    image: kortyx-api:oss
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: [*api-env, *oss-keys]
    command: >
      sh -lc "pnpm --filter @kortyx/telemetry-db db:migrate &&
      pnpm --filter @kortyx/telemetry-db db:bootstrap"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: kortyx-api:oss
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-env
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 6400
    ports:
      - "127.0.0.1:${API_PORT:-6400}:6400"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:6400/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  studio:
    image: kortyx-studio:oss
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 6300
      KORTYX_API_URL: http://api:6400
      KORTYX_STUDIO_API_KEY: ${KORTYX_STUDIO_API_KEY:-ktyx_test_localstudio_oss-demo-studio-secret-change-me}
      KORTYX_STUDIO_AUTH_MODE: ${KORTYX_STUDIO_AUTH_MODE:-basic}
      KORTYX_STUDIO_BASIC_AUTH_USERNAME: ${KORTYX_STUDIO_BASIC_AUTH_USERNAME:-admin}
      KORTYX_STUDIO_BASIC_AUTH_PASSWORD: ${KORTYX_STUDIO_BASIC_AUTH_PASSWORD:-kortyx}
    ports:
      - "127.0.0.1:${STUDIO_PORT:-6300}:6300"
    depends_on:
      api:
        condition: service_healthy

  smoke:
    image: kortyx-api:oss
    profiles: ["smoke"]
    environment:
      KORTYX_API_URL: http://api:6400
      <<: *oss-keys
    command: pnpm --filter @kortyx/api smoke:telemetry
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  kortyx-postgres:
