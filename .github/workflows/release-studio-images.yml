name: Release / Studio Images

on:
  workflow_call:
    inputs:
      api_digest:
        description: Staged API index built alongside npm publication
        type: string
        default: ""
      studio_digest:
        description: Staged Studio index built alongside npm publication
        type: string
        default: ""
      release_tag:
        required: true
        type: string
      deployment_strategy:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Studio release tag to publish after npm publication (studio-vX.Y.Z)
        required: true
        type: string
      deployment_strategy:
        description: Whether this release can overlap safely with the previous release
        required: true
        default: recreate
        type: choice
        options:
          - recreate
          - rolling

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: studio-oss-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: kortyx-io/kortyx-api
  STUDIO_IMAGE_NAME: kortyx-io/kortyx-studio

jobs:
  prepare:
    name: Validate release
    environment: studio-production-auto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      installer_version: ${{ steps.installer.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Checkout workflow modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/automation
          sparse-checkout: .github
          persist-credentials: false
      - name: Derive and validate version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash ./.github/automation/.github/scripts/studio/validate-release.sh
      - name: Validate supplied staging indexes
        env:
          API_DIGEST: ${{ inputs.api_digest }}
          STUDIO_DIGEST: ${{ inputs.studio_digest }}
        run: |
          if [ -n "$API_DIGEST$STUDIO_DIGEST" ]; then
            [[ "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
            [[ "$STUDIO_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          fi
      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: bash ./.github/automation/.github/scripts/release/require-ci.sh
      - name: Verify publication access before building images
        uses: ./.github/automation/.github/actions/release/studio-update
        with:
          operation: prepare
          account-id: ${{ vars.STUDIO_UPDATES_R2_ACCOUNT_ID }}
          bucket: ${{ vars.STUDIO_UPDATES_R2_BUCKET }}
          access-key-id: ${{ secrets.STUDIO_UPDATES_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.STUDIO_UPDATES_R2_SECRET_ACCESS_KEY }}
      - name: Select published CLI installer version
        id: installer
        run: echo "version=$(node -p 'require(\"./packages/kortyx/package.json\").version')" >> "$GITHUB_OUTPUT"
  build:
    name: Build staging images for standalone recovery
    needs: prepare
    if: inputs.api_digest == '' && inputs.studio_digest == ''
    uses: ./.github/workflows/build-studio-images.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  verify-staging:
    name: Verify staging image indexes
    needs: [prepare, build]
    # A skipped build is expected only when the orchestrator supplied both indexes.
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && inputs.api_digest != '' && inputs.studio_digest != ''))
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ inputs.api_digest || needs.build.outputs.api_digest }}
      studio_digest: ${{ inputs.studio_digest || needs.build.outputs.studio_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Checkout workflow modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/automation
          sparse-checkout: .github
          persist-credentials: false
      - name: Setup container registry
        uses: ./.github/automation/.github/actions/setup/container-registry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          qemu: "false"
      - name: Verify staging indexes and digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          API_DIGEST: ${{ inputs.api_digest || needs.build.outputs.api_digest }}
          STUDIO_DIGEST: ${{ inputs.studio_digest || needs.build.outputs.studio_digest }}
          IMAGE_TAG_PREFIX: staging-v
        run: bash ./.github/automation/.github/scripts/studio/verify-images.sh
  smoke:
    name: Clean install and smoke (${{ matrix.platform }})
    needs:
      - prepare
      - verify-staging
    # Explicit success requirements allow an orchestrator-supplied build to skip
    # the recovery branch without skipping these mandatory tests transitively.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.verify-staging.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            node_arch: x64
            id: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            node_arch: arm64
            id: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Checkout workflow modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/automation
          sparse-checkout: .github
          persist-credentials: false
      - name: Setup Node and pnpm
        uses: ./.github/automation/.github/actions/setup/node
        with:
          install: "false"
      - name: Setup container registry
        uses: ./.github/automation/.github/actions/setup/container-registry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          qemu: "false"
      - name: Install and verify the staged release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          KORTYX_VERSION: ${{ needs.prepare.outputs.installer_version }}
          API_DIGEST: ${{ needs.verify-staging.outputs.api_digest }}
          STUDIO_DIGEST: ${{ needs.verify-staging.outputs.studio_digest }}
          DEPLOYMENT_STRATEGY: ${{ inputs.deployment_strategy }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          ARCH_ID: ${{ matrix.id }}
        run: bash ./.github/automation/.github/scripts/studio/smoke-install.sh
  promote:
    name: Publish production images and update channel
    needs:
      - prepare
      - verify-staging
      - smoke
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.verify-staging.result == 'success' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    environment:
      name: studio-production-auto
      url: https://github.com/kortyx-io/kortyx/pkgs/container/kortyx-studio
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Checkout workflow modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/automation
          sparse-checkout: .github
          persist-credentials: false
      - name: Check update publication configuration
        uses: ./.github/automation/.github/actions/release/studio-update
        with:
          operation: prepare
          account-id: ${{ vars.STUDIO_UPDATES_R2_ACCOUNT_ID }}
          bucket: ${{ vars.STUDIO_UPDATES_R2_BUCKET }}
          access-key-id: ${{ secrets.STUDIO_UPDATES_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.STUDIO_UPDATES_R2_SECRET_ACCESS_KEY }}
      - name: Setup container registry
        uses: ./.github/automation/.github/actions/setup/container-registry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          qemu: "false"
      - name: Promote tested API digest
        uses: ./.github/automation/.github/actions/containers/promote
        with:
          source: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}@${{ needs.verify-staging.outputs.api_digest }}
          tags: |-
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:v${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
          expected-digest: ${{ needs.verify-staging.outputs.api_digest }}
      - name: Promote tested STUDIO digest
        uses: ./.github/automation/.github/actions/containers/promote
        with:
          source: ${{ env.REGISTRY }}/${{ env.STUDIO_IMAGE_NAME }}@${{ needs.verify-staging.outputs.studio_digest }}
          tags: |-
            ${{ env.REGISTRY }}/${{ env.STUDIO_IMAGE_NAME }}:v${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.STUDIO_IMAGE_NAME }}:latest
          expected-digest: ${{ needs.verify-staging.outputs.studio_digest }}
      - name: Summarize promoted images
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          API_DIGEST: ${{ needs.verify-staging.outputs.api_digest }}
          STUDIO_DIGEST: ${{ needs.verify-staging.outputs.studio_digest }}
        run: bash ./.github/automation/.github/scripts/studio/promotion-summary.sh
      - name: Publish the completed release to the update CDN
        uses: ./.github/automation/.github/actions/release/studio-update
        with:
          account-id: ${{ vars.STUDIO_UPDATES_R2_ACCOUNT_ID }}
          bucket: ${{ vars.STUDIO_UPDATES_R2_BUCKET }}
          access-key-id: ${{ secrets.STUDIO_UPDATES_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.STUDIO_UPDATES_R2_SECRET_ACCESS_KEY }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          API_DIGEST: ${{ needs.verify-staging.outputs.api_digest }}
          STUDIO_DIGEST: ${{ needs.verify-staging.outputs.studio_digest }}
          DEPLOYMENT_STRATEGY: ${{ inputs.deployment_strategy }}
      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
