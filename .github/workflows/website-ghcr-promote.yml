name: Promote Website Image (GHCR)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kortyx-io/website
  COOLIFY_URL: ${{ vars.COOLIFY_URL }}
  COOLIFY_PRODUCTION_APP_UUID: ${{ vars.COOLIFY_PRODUCTION_APP_UUID }}
  PRODUCTION_URL: https://kortyx.io

jobs:
  promote-prod:
    name: Promote Image To Prod Tags
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote staging-latest to latest
        run: |
          source_image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"

          docker buildx imagetools inspect "${source_image}"

          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${source_image}"

          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Deploy Coolify production image
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_PRODUCTION_DEPLOY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "Missing required secret: COOLIFY_PRODUCTION_DEPLOY_TOKEN"
            exit 1
          fi
          if [ -z "${COOLIFY_URL}" ] || [ -z "${COOLIFY_PRODUCTION_APP_UUID}" ]; then
            echo "Missing required repository variables: COOLIFY_URL, COOLIFY_PRODUCTION_APP_UUID"
            exit 1
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"uuid\":\"${COOLIFY_PRODUCTION_APP_UUID}\",\"force\":true}" \
            "${COOLIFY_URL}/api/v1/deploy")

          deployment_uuid=$(jq --exit-status --raw-output \
            '.deployments[0].deployment_uuid' <<<"${response}")

          for attempt in $(seq 1 60); do
            deployment=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/${deployment_uuid}")
            status=$(jq --raw-output '.status' <<<"${deployment}")

            case "${status}" in
              finished)
                echo "Coolify production deployment finished."
                break
                ;;
              failed|cancelled)
                echo "Coolify production deployment ended with status: ${status}"
                exit 1
                ;;
            esac

            if [ "${attempt}" -eq 60 ]; then
              echo "Timed out waiting for Coolify production deployment."
              exit 1
            fi

            echo "Waiting for Coolify production deployment (${attempt}/60): ${status}"
            sleep 5
          done

      - name: Verify production URL
        run: |
          headers=$(curl --fail --silent --show-error --head \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "${PRODUCTION_URL}/docs/start-here")

          if grep --ignore-case --quiet '^x-robots-tag:.*noindex' <<<"${headers}"; then
            echo "Production URL unexpectedly has the noindex header."
            exit 1
          fi

          echo "Production smoke test passed: ${PRODUCTION_URL}"
