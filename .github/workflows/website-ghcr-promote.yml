name: Promote Website Image (GHCR)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kortyx-io/website
  COOLIFY_URL: ${{ vars.COOLIFY_URL }}
  COOLIFY_PRODUCTION_APP_UUID: ${{ vars.COOLIFY_PRODUCTION_APP_UUID }}
  COOLIFY_PRODUCTION_TEST_URL: ${{ vars.COOLIFY_PRODUCTION_TEST_URL }}

jobs:
  promote-prod:
    name: Promote Image To Prod Tags
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote staging-latest to latest
        run: |
          source_image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"

          docker buildx imagetools inspect "${source_image}"

          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${source_image}"

          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Checkout Railway image update helper
        uses: actions/checkout@v6
        with:
          repository: brody192/image-update-and-redeploy
          path: .tmp/image-update-and-redeploy

      - name: Install and build Railway image update helper
        working-directory: .tmp/image-update-and-redeploy
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Update Railway production service image and redeploy
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_WEBSITE_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
        run: |
          if [ -z "${RAILWAY_API_TOKEN}" ] || [ -z "${RAILWAY_SERVICE_ID}" ] || [ -z "${RAILWAY_ENVIRONMENT_ID}" ]; then
            echo "Missing required Railway secrets: RAILWAY_API_TOKEN, RAILWAY_WEBSITE_SERVICE_ID, RAILWAY_PRODUCTION_ENVIRONMENT_ID"
            exit 1
          fi

          node .tmp/image-update-and-redeploy/dist/main.js \
            --serviceId="${RAILWAY_SERVICE_ID}" \
            --environmentId="${RAILWAY_ENVIRONMENT_ID}" \
            --image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Deploy Coolify production image
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_PRODUCTION_DEPLOY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "Missing required secret: COOLIFY_PRODUCTION_DEPLOY_TOKEN"
            exit 1
          fi
          if [ -z "${COOLIFY_URL}" ] || [ -z "${COOLIFY_PRODUCTION_APP_UUID}" ]; then
            echo "Missing required repository variables: COOLIFY_URL, COOLIFY_PRODUCTION_APP_UUID"
            exit 1
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"uuid\":\"${COOLIFY_PRODUCTION_APP_UUID}\",\"force\":true}" \
            "${COOLIFY_URL}/api/v1/deploy")

          deployment_uuid=$(jq --exit-status --raw-output \
            '.deployments[0].deployment_uuid' <<<"${response}")

          for attempt in $(seq 1 60); do
            deployment=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/${deployment_uuid}")
            status=$(jq --raw-output '.status' <<<"${deployment}")

            case "${status}" in
              finished)
                echo "Coolify production deployment finished."
                break
                ;;
              failed|cancelled)
                echo "Coolify production deployment ended with status: ${status}"
                exit 1
                ;;
            esac

            if [ "${attempt}" -eq 60 ]; then
              echo "Timed out waiting for Coolify production deployment."
              exit 1
            fi

            echo "Waiting for Coolify production deployment (${attempt}/60): ${status}"
            sleep 5
          done

      - name: Verify Coolify production test URL
        run: |
          if [ -z "${COOLIFY_PRODUCTION_TEST_URL}" ]; then
            echo "Missing required repository variable: COOLIFY_PRODUCTION_TEST_URL"
            exit 1
          fi

          headers=$(curl --fail --silent --show-error --head \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "${COOLIFY_PRODUCTION_TEST_URL}/docs/start-here")

          if ! grep --ignore-case --quiet '^x-robots-tag:.*noindex' <<<"${headers}"; then
            echo "Coolify production test URL is missing the noindex header."
            exit 1
          fi

          echo "Coolify production smoke test passed: ${COOLIFY_PRODUCTION_TEST_URL}"
