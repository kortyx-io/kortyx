name: Recover Release (Studio update channel)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Studio release tag (studio-vX.Y.Z)
        required: true
        type: string
      api_digest:
        description: Tested and promoted API index digest (sha256:...)
        required: true
        type: string
      studio_digest:
        description: Tested and promoted Studio index digest (sha256:...)
        required: true
        type: string
      deployment_strategy:
        description: Compatibility recorded for this release
        required: true
        default: recreate
        type: choice
        options:
          - recreate
          - rolling

permissions:
  contents: read
  packages: read

concurrency:
  group: studio-oss-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: kortyx-io/kortyx-api
  STUDIO_IMAGE_NAME: kortyx-io/kortyx-studio

jobs:
  recover:
    name: Approve and republish update manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: studio-production
      url: https://updates.kortyx.io/studio/stable.json
    steps:
      - name: Checkout publisher from main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Checkout release candidate
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: .release-candidate
          fetch-depth: 0

      - name: Validate release and recorded digests
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          API_DIGEST: ${{ inputs.api_digest }}
          STUDIO_DIGEST: ${{ inputs.studio_digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^studio-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Enter a release-please Studio tag (studio-v<version>), got: $RELEASE_TAG"
            exit 1
          fi
          if [[ ! "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || [[ ! "$STUDIO_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Both recorded image digests must use the sha256:<64 lowercase hex characters> format."
            exit 1
          fi

          version="${RELEASE_TAG#studio-v}"
          package_version="$(node -p 'require("./.release-candidate/apps/studio/package.json").version')"
          manifest_version="$(node -p 'require("./.release-candidate/.github/release-please/manifest.json")["apps/studio"]')"
          if [ "$version" != "$package_version" ] || [ "$version" != "$manifest_version" ]; then
            echo "Studio tag ($version), package ($package_version), and release-please manifest ($manifest_version) must match."
            exit 1
          fi

          git -C .release-candidate fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git -C .release-candidate merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"; then
            echo "Studio release tags must point to a commit merged into the default branch."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check update publication configuration
        env:
          STUDIO_UPDATES_R2_ACCOUNT_ID: ${{ vars.STUDIO_UPDATES_R2_ACCOUNT_ID }}
          STUDIO_UPDATES_R2_BUCKET: ${{ vars.STUDIO_UPDATES_R2_BUCKET }}
          STUDIO_UPDATES_R2_ACCESS_KEY_ID: ${{ secrets.STUDIO_UPDATES_R2_ACCESS_KEY_ID }}
          STUDIO_UPDATES_R2_SECRET_ACCESS_KEY: ${{ secrets.STUDIO_UPDATES_R2_SECRET_ACCESS_KEY }}
        run: |
          for name in STUDIO_UPDATES_R2_ACCOUNT_ID STUDIO_UPDATES_R2_BUCKET STUDIO_UPDATES_R2_ACCESS_KEY_ID STUDIO_UPDATES_R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing update publication configuration: ${name}"
              exit 1
            fi
          done

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install release publisher dependencies
        run: python -m pip install -r .github/scripts/studio-release/requirements.txt

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify promoted production indexes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          API_DIGEST: ${{ inputs.api_digest }}
          STUDIO_DIGEST: ${{ inputs.studio_digest }}
        run: |
          verify_index() {
            image_ref="$1"
            expected_digest="$2"
            descriptor="$(docker buildx imagetools inspect --format '{{json .}}' "$image_ref")"
            actual_digest="$(printf '%s' "$descriptor" | jq -r '.manifest.digest')"
            platforms="$(printf '%s' "$descriptor" | jq -r '.manifest.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' | sort -u)"

            test "$actual_digest" = "$expected_digest"
            printf '%s\n' "$platforms" | grep -Fx 'linux/amd64'
            printf '%s\n' "$platforms" | grep -Fx 'linux/arm64'
          }

          verify_index "${REGISTRY}/${API_IMAGE_NAME}:v${VERSION}" "$API_DIGEST"
          verify_index "${REGISTRY}/${STUDIO_IMAGE_NAME}:v${VERSION}" "$STUDIO_DIGEST"

      - name: Publish the recovered release to the update CDN
        env:
          VERSION: ${{ steps.release.outputs.version }}
          API_DIGEST: ${{ inputs.api_digest }}
          STUDIO_DIGEST: ${{ inputs.studio_digest }}
          DEPLOYMENT_STRATEGY: ${{ inputs.deployment_strategy }}
          STUDIO_UPDATES_R2_ACCOUNT_ID: ${{ vars.STUDIO_UPDATES_R2_ACCOUNT_ID }}
          STUDIO_UPDATES_R2_BUCKET: ${{ vars.STUDIO_UPDATES_R2_BUCKET }}
          STUDIO_UPDATES_R2_ACCESS_KEY_ID: ${{ secrets.STUDIO_UPDATES_R2_ACCESS_KEY_ID }}
          STUDIO_UPDATES_R2_SECRET_ACCESS_KEY: ${{ secrets.STUDIO_UPDATES_R2_SECRET_ACCESS_KEY }}
        run: |
          jq -n --arg version "$VERSION" \
            --arg api "${REGISTRY}/${API_IMAGE_NAME}@${API_DIGEST}" \
            --arg studio "${REGISTRY}/${STUDIO_IMAGE_NAME}@${STUDIO_DIGEST}" \
            --arg strategy "$DEPLOYMENT_STRATEGY" \
            '{format: 1, installer: 1, version: $version, api: $api, studio: $studio, deployment: {strategy: $strategy}}' \
            > "$RUNNER_TEMP/studio-update.json"
          python .github/scripts/studio-release/publish.py "$RUNNER_TEMP/studio-update.json"

          {
            echo "## Recovered Studio self-hosted v${VERSION} update channel"
            echo
            echo "| Image | Verified production digest |"
            echo "| --- | --- |"
            echo "| API | \`${API_DIGEST}\` |"
            echo "| Studio | \`${STUDIO_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
