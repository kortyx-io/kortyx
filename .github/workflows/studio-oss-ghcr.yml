name: Publish Release (Studio)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Studio release tag to publish after npm publication (studio-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: studio-oss-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: kortyx-io/kortyx-api
  STUDIO_IMAGE_NAME: kortyx-io/kortyx-studio

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Derive and validate version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^studio-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Enter a release-please Studio tag (studio-v<version>), got: $RELEASE_TAG"
            exit 1
          fi

          version="${RELEASE_TAG#studio-v}"
          package_version="$(node -p 'require("./apps/studio/package.json").version')"
          manifest_version="$(node -p 'require("./.github/release-please/manifest.json")["apps/studio"]')"
          if [ "$version" != "$package_version" ] || [ "$version" != "$manifest_version" ]; then
            echo "Studio tag ($version), package ($package_version), and release-please manifest ($manifest_version) must match."
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Studio release tags must point to a commit merged into main."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package-installer:
    name: Package clean-install candidate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package graph
        run: pnpm turbo run build --filter=kortyx

      - name: Pack CLI packages
        run: |
          mkdir -p "$RUNNER_TEMP/studio-installer"
          pnpm --dir packages/cli pack --pack-destination "$RUNNER_TEMP/studio-installer"
          pnpm --dir packages/kortyx pack --pack-destination "$RUNNER_TEMP/studio-installer"

      - name: Upload installer candidate
        uses: actions/upload-artifact@v7
        with:
          name: studio-installer-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/studio-installer/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-staging:
    name: Publish multi-architecture staging images
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      studio_digest: ${{ steps.studio.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a production version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          api_release="${REGISTRY}/${API_IMAGE_NAME}:v${VERSION}"
          studio_release="${REGISTRY}/${STUDIO_IMAGE_NAME}:v${VERSION}"
          if docker buildx imagetools inspect "$api_release" >/dev/null 2>&1; then
            echo "$api_release already exists. Production versions are immutable."
            exit 1
          fi
          if docker buildx imagetools inspect "$studio_release" >/dev/null 2>&1; then
            echo "$studio_release already exists. Production versions are immutable."
            exit 1
          fi

      - name: Build and push API staging image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:staging-latest
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:staging-v${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=kortyx-api-image
          cache-to: type=gha,mode=max,scope=kortyx-api-image

      - name: Build and push Studio staging image
        id: studio
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/studio/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.STUDIO_IMAGE_NAME }}:staging-latest
            ${{ env.REGISTRY }}/${{ env.STUDIO_IMAGE_NAME }}:staging-v${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=kortyx-studio-image
          cache-to: type=gha,mode=max,scope=kortyx-studio-image

      - name: Verify staging indexes and digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          STUDIO_DIGEST: ${{ steps.studio.outputs.digest }}
        run: |
          verify_index() {
            image_ref="$1"
            expected_digest="$2"
            descriptor="$(docker buildx imagetools inspect --format '{{json .}}' "$image_ref")"
            actual_digest="$(printf '%s' "$descriptor" | jq -r '.manifest.digest')"
            platforms="$(printf '%s' "$descriptor" | jq -r '.manifest.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' | sort -u)"

            test "$actual_digest" = "$expected_digest"
            printf '%s\n' "$platforms" | grep -Fx 'linux/amd64'
            printf '%s\n' "$platforms" | grep -Fx 'linux/arm64'
          }

          verify_index "${REGISTRY}/${API_IMAGE_NAME}:staging-v${VERSION}" "$API_DIGEST"
          verify_index "${REGISTRY}/${STUDIO_IMAGE_NAME}:staging-v${VERSION}" "$STUDIO_DIGEST"

  smoke:
    name: Clean install and smoke (${{ matrix.platform }})
    needs: [prepare, package-installer, publish-staging]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            node_arch: x64
            id: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            node_arch: arm64
            id: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download installer candidate
        uses: actions/download-artifact@v8
        with:
          name: studio-installer-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/studio-installer

      - name: Install and verify the staged release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          API_DIGEST: ${{ needs.publish-staging.outputs.api_digest }}
          STUDIO_DIGEST: ${{ needs.publish-staging.outputs.studio_digest }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          ARCH_ID: ${{ matrix.id }}
        run: |
          clean_dir="$RUNNER_TEMP/kortyx-clean-install"
          studio_home="$RUNNER_TEMP/kortyx-studio-home"
          backup_dir="$RUNNER_TEMP/kortyx-studio-backup"
          api_ref="${REGISTRY}/${API_IMAGE_NAME}@${API_DIGEST}"
          studio_ref="${REGISTRY}/${STUDIO_IMAGE_NAME}@${STUDIO_DIGEST}"
          api_tag="${REGISTRY}/${API_IMAGE_NAME}:staging-v${VERSION}"
          studio_tag="${REGISTRY}/${STUDIO_IMAGE_NAME}:staging-v${VERSION}"

          cleanup() {
            result=$?
            if [ "$result" -ne 0 ] && [ -f "$studio_home/compose.yml" ]; then
              docker compose --env-file "$studio_home/.env" -f "$studio_home/compose.yml" ps || true
              docker compose --env-file "$studio_home/.env" -f "$studio_home/compose.yml" logs --no-color || true
            fi
            if [ -x "$clean_dir/node_modules/.bin/kortyx" ] && [ -f "$studio_home/config.json" ]; then
              "$clean_dir/node_modules/.bin/kortyx" studio reset --home "$studio_home" --confirm || true
            fi
            rm -rf "$clean_dir" "$studio_home" "$backup_dir"
            exit "$result"
          }
          trap cleanup EXIT

          descriptor_digest() {
            docker buildx imagetools inspect --format '{{json .}}' "$1" | jq -r '.manifest.digest'
          }

          test "$(descriptor_digest "$api_tag")" = "$API_DIGEST"
          test "$(descriptor_digest "$studio_tag")" = "$STUDIO_DIGEST"

          mapfile -t package_files < <(find "$RUNNER_TEMP/studio-installer" -name '*.tgz' -type f | sort)
          test "${#package_files[@]}" -eq 2
          mkdir -p "$clean_dir"
          npm install --prefix "$clean_dir" --ignore-scripts "${package_files[@]}"

          cli="$clean_dir/node_modules/.bin/kortyx"
          "$cli" --help

          test "$(docker run --rm "$api_ref" node -p 'process.arch')" = "$EXPECTED_NODE_ARCH"
          test "$(docker run --rm "$studio_ref" node -p 'process.arch')" = "$EXPECTED_NODE_ARCH"
          test "$(docker run --rm "$studio_ref" node -p 'require("/app/apps/studio/package.json").version')" = "$VERSION"

          KORTYX_API_IMAGE="${REGISTRY}/${API_IMAGE_NAME}" \
          KORTYX_STUDIO_IMAGE="${REGISTRY}/${STUDIO_IMAGE_NAME}" \
            "$cli" studio start \
              --home "$studio_home" \
              --api-port 16400 \
              --studio-port 16300 \
              --image-tag "staging-v${VERSION}" \
              --project-name "kortyx-studio-release-${ARCH_ID}"

          credentials_before="$(sha256sum "$studio_home/.env" | cut -d ' ' -f 1)"
          smoke_run_id="release-smoke-${VERSION}-${ARCH_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$backup_dir"

          docker run --rm --network host \
            --env-file "$studio_home/.env" \
            -e KORTYX_API_URL=http://127.0.0.1:16400 \
            -e KORTYX_SMOKE_RUN_ID="$smoke_run_id" \
            "$api_ref" \
            pnpm --filter @kortyx/api smoke:telemetry

          "$cli" studio credentials --home "$studio_home" > "$backup_dir/credentials.txt"
          grep -Fq "KORTYX_TELEMETRY_API_URL=http://localhost:16400" "$backup_dir/credentials.txt"
          grep -Fq "KORTYX_TELEMETRY_API_KEY=" "$backup_dir/credentials.txt"
          cp -p "$studio_home/.env" "$studio_home/config.json" "$backup_dir/"
          docker compose \
            --env-file "$studio_home/.env" \
            -f "$studio_home/compose.yml" \
            exec -T postgres \
            pg_dump -U kortyx -d kortyx -Fc > "$backup_dir/database.dump"
          test -s "$backup_dir/database.dump"

          "$cli" studio stop --home "$studio_home"
          KORTYX_API_IMAGE="${REGISTRY}/${API_IMAGE_NAME}" \
          KORTYX_STUDIO_IMAGE="${REGISTRY}/${STUDIO_IMAGE_NAME}" \
            "$cli" studio start --home "$studio_home"

          credentials_after="$(sha256sum "$studio_home/.env" | cut -d ' ' -f 1)"
          test "$credentials_before" = "$credentials_after"

          verify_smoke_run() {
            docker run --rm --network host \
              --env-file "$studio_home/.env" \
              -e KORTYX_API_URL=http://127.0.0.1:16400 \
              -e KORTYX_EXPECTED_SMOKE_RUN_ID="$smoke_run_id" \
              "$api_ref" \
              node -e '
                const apiUrl = process.env.KORTYX_API_URL;
                const expected = process.env.KORTYX_EXPECTED_SMOKE_RUN_ID;
                const key = process.env.KORTYX_STUDIO_API_KEY;
                fetch(`${apiUrl}/v1/studio/runs`, {
                  headers: { authorization: `Bearer ${key}` },
                })
                  .then(async (response) => {
                    if (!response.ok) throw new Error(await response.text());
                    return response.json();
                  })
                  .then(({ runs }) => {
                    if (!runs.some(({ id }) => id === expected)) {
                      throw new Error(`Persisted smoke run ${expected} was not found.`);
                    }
                    console.log(`Verified persisted smoke run ${expected}.`);
                  });
              '
          }
          verify_smoke_run

          docker compose \
            --env-file "$studio_home/.env" \
            -f "$studio_home/compose.yml" \
            stop api studio
          docker compose \
            --env-file "$studio_home/.env" \
            -f "$studio_home/compose.yml" \
            exec -T postgres \
            pg_restore --clean --if-exists --no-owner --exit-on-error \
              -U kortyx -d kortyx < "$backup_dir/database.dump"
          "$cli" studio restart --home "$studio_home"
          verify_smoke_run

          "$cli" studio status --home "$studio_home"
          "$cli" studio logs --home "$studio_home" --no-follow

          old_studio_key="$(sed -n 's/^KORTYX_STUDIO_API_KEY=//p' "$studio_home/.env")"
          old_telemetry_key="$(sed -n 's/^KORTYX_TELEMETRY_API_KEY=//p' "$studio_home/.env")"
          "$cli" studio credentials --home "$studio_home" --rotate \
            > "$backup_dir/rotated-credentials.txt"
          new_studio_key="$(sed -n 's/^KORTYX_STUDIO_API_KEY=//p' "$studio_home/.env")"
          new_telemetry_key="$(sed -n 's/^KORTYX_TELEMETRY_API_KEY=//p' "$studio_home/.env")"
          test "$old_studio_key" != "$new_studio_key"
          test "$old_telemetry_key" != "$new_telemetry_key"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $old_studio_key" \
            http://127.0.0.1:16400/v1/studio/runs)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $new_studio_key" \
            http://127.0.0.1:16400/v1/studio/runs)" = "200"

          KORTYX_API_IMAGE="${REGISTRY}/${API_IMAGE_NAME}" \
          KORTYX_STUDIO_IMAGE="${REGISTRY}/${STUDIO_IMAGE_NAME}" \
          KORTYX_STUDIO_IMAGE_TAG="staging-v${VERSION}" \
          KORTYX_SMOKE_ID="${ARCH_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          KORTYX_SMOKE_API_PORT=26400 \
          KORTYX_SMOKE_STUDIO_PORT=26300 \
            ./scripts/smoke-studio-external-postgres.sh

  promote:
    name: Approve and publish production images
    needs: [prepare, publish-staging, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: studio-production
      url: https://github.com/kortyx-io/kortyx/pkgs/container/kortyx-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact tested digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          API_DIGEST: ${{ needs.publish-staging.outputs.api_digest }}
          STUDIO_DIGEST: ${{ needs.publish-staging.outputs.studio_digest }}
        run: |
          promote_image() {
            image_name="$1"
            tested_digest="$2"
            source_ref="${REGISTRY}/${image_name}@${tested_digest}"
            version_ref="${REGISTRY}/${image_name}:v${VERSION}"
            latest_ref="${REGISTRY}/${image_name}:latest"

            docker buildx imagetools create \
              -t "$version_ref" \
              -t "$latest_ref" \
              "$source_ref"

            version_digest="$(docker buildx imagetools inspect --format '{{json .}}' "$version_ref" | jq -r '.manifest.digest')"
            latest_digest="$(docker buildx imagetools inspect --format '{{json .}}' "$latest_ref" | jq -r '.manifest.digest')"
            test "$version_digest" = "$tested_digest"
            test "$latest_digest" = "$tested_digest"
          }

          promote_image "$API_IMAGE_NAME" "$API_DIGEST"
          promote_image "$STUDIO_IMAGE_NAME" "$STUDIO_DIGEST"

          {
            echo "## Studio self-hosted v${VERSION}"
            echo
            echo "| Image | Tested and promoted digest |"
            echo "| --- | --- |"
            echo "| API | \`${API_DIGEST}\` |"
            echo "| Studio | \`${STUDIO_DIGEST}\` |"
            echo
            echo "Native clean-install smoke tests passed on linux/amd64 and linux/arm64."
          } >> "$GITHUB_STEP_SUMMARY"
