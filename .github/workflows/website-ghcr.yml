name: Publish Website Image (GHCR)

on:
  push:
    tags:
      - "website-v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kortyx-io/website
  COOLIFY_URL: ${{ vars.COOLIFY_URL }}
  COOLIFY_STAGING_APP_UUID: ${{ vars.COOLIFY_STAGING_APP_UUID }}

jobs:
  publish-staging:
    name: Publish Staging Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Generate docs last updated manifest
        run: node apps/website/scripts/generate-docs-last-updated.mjs

      - name: Derive version from tag
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#website-v}"
          if [ -z "$version" ] || [ "$version" = "$ref" ]; then
            echo "Expected tag format website-v<version>, got: $ref"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/website/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-v${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=website-image
          cache-to: type=gha,mode=max,scope=website-image

      - name: Deploy staging image on Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_STAGING_DEPLOY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "Missing required secret: COOLIFY_STAGING_DEPLOY_TOKEN"
            exit 1
          fi
          if [ -z "${COOLIFY_URL}" ] || [ -z "${COOLIFY_STAGING_APP_UUID}" ]; then
            echo "Missing required repository variables: COOLIFY_URL, COOLIFY_STAGING_APP_UUID"
            exit 1
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"uuid\":\"${COOLIFY_STAGING_APP_UUID}\",\"force\":true}" \
            "${COOLIFY_URL}/api/v1/deploy")

          deployment_uuid=$(jq --exit-status --raw-output \
            '.deployments[0].deployment_uuid' <<<"${response}")

          for attempt in $(seq 1 60); do
            deployment=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/${deployment_uuid}")
            status=$(jq --raw-output '.status' <<<"${deployment}")

            case "${status}" in
              finished)
                echo "Coolify staging deployment finished."
                exit 0
                ;;
              failed|cancelled)
                echo "Coolify staging deployment ended with status: ${status}"
                exit 1
                ;;
            esac

            echo "Waiting for Coolify staging deployment (${attempt}/60): ${status}"
            sleep 5
          done

          echo "Timed out waiting for Coolify staging deployment."
          exit 1
