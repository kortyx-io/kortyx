name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number to check
        required: true
        type: string

permissions: {}

jobs:
  agreement:
    if: >-
      github.repository == 'kortyx-io/kortyx' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == 'main') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request && github.event.comment.user.type == 'User'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted workflow modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/automation
          sparse-checkout: .github
          persist-credentials: false
      - name: Verify contributor agreements
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CLA_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const root = `${process.env.GITHUB_WORKSPACE}/.github/automation`;
            const { run } = require(`${root}/.github/scripts/cla/check.cjs`);
            await run({ github, context: {
              repo: context.repo, payload: context.payload, runId: context.runId,
              sha: process.env.CLA_WORKFLOW_SHA,
            }, core, root });
