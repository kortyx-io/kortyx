name: Website PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: website-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kortyx-io/website
  COOLIFY_URL: ${{ vars.COOLIFY_URL }}
  COOLIFY_STAGING_APP_UUID: ${{ vars.COOLIFY_STAGING_APP_UUID }}
  PREVIEW_TAG: pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.kortyx.dev

jobs:
  deploy-preview:
    name: Build and deploy preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Generate docs last updated manifest
        run: node apps/website/scripts/generate-docs-last-updated.mjs

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/website/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PREVIEW_TAG }}
          cache-from: type=gha,scope=website-image
          cache-to: type=gha,mode=max,scope=website-image

      - name: Deploy preview on Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_STAGING_DEPLOY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "Missing required secret: COOLIFY_STAGING_DEPLOY_TOKEN"
            exit 1
          fi
          if [ -z "${COOLIFY_URL}" ] || [ -z "${COOLIFY_STAGING_APP_UUID}" ]; then
            echo "Missing required repository variables: COOLIFY_URL, COOLIFY_STAGING_APP_UUID"
            exit 1
          fi

          payload=$(jq --null-input --compact-output \
            --arg uuid "${COOLIFY_STAGING_APP_UUID}" \
            --argjson pull_request_id "${PR_NUMBER}" \
            --arg docker_tag "${PREVIEW_TAG}" \
            '{
              uuid: $uuid,
              force: true,
              pull_request_id: $pull_request_id,
              docker_tag: $docker_tag
            }')

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "${COOLIFY_URL}/api/v1/deploy")

          deployment_uuid=$(jq --exit-status --raw-output \
            '.deployments[0].deployment_uuid' <<<"${response}")

          for attempt in $(seq 1 60); do
            deployment=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/${deployment_uuid}")
            deployment_status=$(jq --raw-output '.status' <<<"${deployment}")

            case "${deployment_status}" in
              finished)
                echo "Coolify preview deployment finished."
                break
                ;;
              failed|cancelled)
                echo "Coolify preview deployment ended with status: ${deployment_status}"
                exit 1
                ;;
            esac

            if [ "${attempt}" -eq 60 ]; then
              echo "Timed out waiting for Coolify preview deployment."
              exit 1
            fi

            echo "Waiting for Coolify preview deployment (${attempt}/60): ${deployment_status}"
            sleep 5
          done

      - name: Verify Cloudflare Access and publish preview URL
        run: |
          headers=$(curl --silent --show-error --head --retry 10 --retry-all-errors \
            --retry-delay 3 "${PREVIEW_URL}")

          if ! grep --ignore-case --quiet '^location: https://.*\.cloudflareaccess\.com/' <<<"${headers}"; then
            echo "Preview URL is not protected by Cloudflare Access: ${PREVIEW_URL}"
            exit 1
          fi

          echo "### Website preview" >> "${GITHUB_STEP_SUMMARY}"
          echo "[${PREVIEW_URL}](${PREVIEW_URL})" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish preview URL on pull request
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- kortyx-website-preview -->";
            const body = `${marker}\n### Website preview\n[Open ${process.env.PREVIEW_URL}](${process.env.PREVIEW_URL})\n\nProtected by Cloudflare Access.`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  remove-preview:
    name: Remove preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Remove preview from Coolify
        env:
          COOLIFY_CLEANUP_TOKEN: ${{ secrets.COOLIFY_STAGING_PREVIEW_CLEANUP_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "${COOLIFY_CLEANUP_TOKEN}" ]; then
            echo "Missing required secret: COOLIFY_STAGING_PREVIEW_CLEANUP_TOKEN"
            exit 1
          fi
          if [ -z "${COOLIFY_URL}" ] || [ -z "${COOLIFY_STAGING_APP_UUID}" ]; then
            echo "Missing required repository variables: COOLIFY_URL, COOLIFY_STAGING_APP_UUID"
            exit 1
          fi

          http_status=$(curl --silent --show-error \
            --output /tmp/coolify-preview-delete.json \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${COOLIFY_CLEANUP_TOKEN}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_STAGING_APP_UUID}/previews/${PR_NUMBER}")

          if [ "${http_status}" != "200" ] && [ "${http_status}" != "404" ]; then
            echo "Coolify preview cleanup failed with HTTP ${http_status}."
            exit 1
          fi

          echo "Coolify preview cleanup completed with HTTP ${http_status}."

      - name: Mark preview as removed on pull request
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- kortyx-website-preview -->";
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\nWebsite preview removed.`,
              });
            }
