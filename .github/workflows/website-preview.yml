name: Website / Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

concurrency:
  group: website-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kortyx-io/website
  COOLIFY_URL: ${{ vars.COOLIFY_URL }}
  COOLIFY_STAGING_APP_UUID: ${{ vars.COOLIFY_STAGING_APP_UUID }}
  PREVIEW_TAG: pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.kortyx.dev

jobs:
  detect-website-changes:
    name: Detect website changes
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      website: ${{ steps.changed.outputs.result }}
    steps:
      - name: Checkout workflow modules
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/automation
          sparse-checkout: .github
          persist-credentials: false
      - name: Check changed files
        id: changed
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: return await require('./.github/automation/.github/scripts/website/detect-changes.cjs')({ github, context, core });
  deploy-preview:
    name: Build and deploy preview
    needs: detect-website-changes
    if: needs.detect-website-changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout workflow modules
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/automation
          sparse-checkout: .github
          persist-credentials: false
      - name: Setup Node and pnpm
        uses: ./.github/automation/.github/actions/setup/node
        with:
          install: "false"
      - name: Generate docs last updated manifest
        run: node apps/website/scripts/generate-docs-last-updated.mjs
      - name: Setup container registry
        uses: ./.github/automation/.github/actions/setup/container-registry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          qemu: "false"
      - name: Build and push preview image
        uses: ./.github/automation/.github/actions/containers/build-push
        with:
          context: .
          file: apps/website/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PREVIEW_TAG }}
          cache-scope: website-image
      - name: Deploy preview on Coolify
        uses: ./.github/automation/.github/actions/deployment/coolify
        with:
          url: ${{ env.COOLIFY_URL }}
          token: ${{ secrets.COOLIFY_STAGING_DEPLOY_TOKEN }}
          app-uuid: ${{ env.COOLIFY_STAGING_APP_UUID }}
          pr-number: ${{ github.event.pull_request.number }}
          docker-tag: ${{ env.PREVIEW_TAG }}
      - name: Verify Cloudflare Access and publish preview URL
        run: bash ./.github/automation/.github/scripts/website/verify-preview.sh
      - name: Publish preview URL on pull request
        uses: actions/github-script@v8
        with:
          script: return await require('./.github/automation/.github/scripts/website/preview-comment.cjs')({ github, context, core });
  remove-preview:
    name: Remove preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout workflow modules
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/automation
          sparse-checkout: .github
          persist-credentials: false
      - name: Remove preview from Coolify
        uses: ./.github/automation/.github/actions/deployment/coolify
        with:
          url: ${{ env.COOLIFY_URL }}
          token: ${{ secrets.COOLIFY_STAGING_PREVIEW_CLEANUP_TOKEN }}
          app-uuid: ${{ env.COOLIFY_STAGING_APP_UUID }}
          pr-number: ${{ github.event.pull_request.number }}
          operation: remove-preview
      - name: Mark preview as removed on pull request
        uses: actions/github-script@v8
        with:
          script: return await require('./.github/automation/.github/scripts/website/remove-preview-comment.cjs')({ github, context, core });
