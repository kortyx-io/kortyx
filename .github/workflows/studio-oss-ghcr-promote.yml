name: Promote Studio OSS Images (GHCR)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Previously tested Studio OSS staging version without the leading v, for example 0.1.0."
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: kortyx-io/kortyx-api
  STUDIO_IMAGE_NAME: kortyx-io/kortyx-studio

jobs:
  promote-prod:
    name: Promote Images To Production Tags
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        id: version
        run: |
          version="${{ inputs.version }}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}([-.][0-9A-Za-z.-]+)?$'; then
            echo "Expected semantic version, got: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote API image
        run: |
          source_image="${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:staging-v${{ steps.version.outputs.version }}"

          docker buildx imagetools inspect "${source_image}"

          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:v${{ steps.version.outputs.version }}" \
            -t "${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest" \
            "${source_image}"

          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:v${{ steps.version.outputs.version }}"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest"

      - name: Promote Studio image
        run: |
          source_image="${{ env.REGISTRY }}/${{ env.STUDIO_IMAGE_NAME }}:staging-v${{ steps.version.outputs.version }}"

          docker buildx imagetools inspect "${source_image}"

          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.STUDIO_IMAGE_NAME }}:v${{ steps.version.outputs.version }}" \
            -t "${{ env.REGISTRY }}/${{ env.STUDIO_IMAGE_NAME }}:latest" \
            "${source_image}"

          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.STUDIO_IMAGE_NAME }}:v${{ steps.version.outputs.version }}"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.STUDIO_IMAGE_NAME }}:latest"
