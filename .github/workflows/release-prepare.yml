name: Release / Prepare PR

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Release / Orchestrate]
    types: [completed]
    branches: [main]

concurrency:
  group: release-please-prepare
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Checkout workflow modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .github/automation
          sparse-checkout: .github
          persist-credentials: false
      - name: Check unfinished merged releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: return await require('./.github/automation/.github/scripts/release/check-pending-releases.cjs')({ github, context, core });
      - name: Release Please (stable)
        uses: ./.github/automation/.github/actions/release/release-please
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          mode: prepare
        id: release
    timeout-minutes: 20
