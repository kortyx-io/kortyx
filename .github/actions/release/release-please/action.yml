name: Run Release Please
description: Prepare release PRs or create release tags with a GitHub App token.

inputs:
  app-id:
    description: GitHub App ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  mode:
    description: prepare for PRs, tags for GitHub releases
    required: true

outputs:
  releases-created:
    description: Whether Release Please created at least one release.
    value: ${{ steps.release-please.outputs.releases_created }}
  paths-released:
    description: JSON array of released monorepo paths.
    value: ${{ steps.release-please.outputs.paths_released }}
  studio-version:
    description: Released Studio version, when present.
    value: ${{ steps.release-please.outputs['apps/studio--version'] }}
  website-version:
    description: Released website version, when present.
    value: ${{ steps.release-please.outputs['apps/website--version'] }}

runs:
  using: composite
  steps:
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Release Please
      id: release-please
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
      with:
        token: ${{ steps.app-token.outputs.token }}
        skip-github-release: ${{ inputs.mode == 'prepare' }}
        skip-github-pull-request: ${{ inputs.mode == 'tags' }}
        config-file: .github/release-please/config.json
        manifest-file: .github/release-please/manifest.json
