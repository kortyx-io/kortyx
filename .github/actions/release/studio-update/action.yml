name: Publish Studio update channel
description: Check R2 configuration or publish already-verified release digests through the tested CDN publisher.

inputs:
  operation:
    description: prepare installs the publisher before promotion; publish uploads the verified manifest
    required: false
    default: publish
  publisher-root:
    description: Checkout containing the trusted publisher
    required: false
    default: ./.github/automation
  account-id:
    description: R2 account ID
    required: true
  bucket:
    description: R2 bucket
    required: true
  access-key-id:
    description: R2 access key
    required: true
  secret-access-key:
    description: R2 secret access key
    required: true

runs:
  using: composite
  steps:
    - name: Check publication configuration
      shell: bash
      env:
        STUDIO_UPDATES_R2_ACCOUNT_ID: ${{ inputs.account-id }}
        STUDIO_UPDATES_R2_BUCKET: ${{ inputs.bucket }}
        STUDIO_UPDATES_R2_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        STUDIO_UPDATES_R2_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/check-config.sh"
    - name: Setup Python
      if: inputs.operation == 'prepare'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.13"
    - name: Install publisher dependencies
      if: inputs.operation == 'prepare'
      shell: bash
      env:
        PUBLISHER_ROOT: ${{ inputs.publisher-root }}
      run: python -m pip install -r "$PUBLISHER_ROOT/.github/scripts/studio/update-channel/requirements.txt"
    - name: Publish release manifest
      if: inputs.operation == 'publish'
      shell: bash
      env:
        STUDIO_UPDATES_R2_ACCOUNT_ID: ${{ inputs.account-id }}
        STUDIO_UPDATES_R2_BUCKET: ${{ inputs.bucket }}
        STUDIO_UPDATES_R2_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        STUDIO_UPDATES_R2_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        PUBLISHER_ROOT: ${{ inputs.publisher-root }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/publish.sh"
