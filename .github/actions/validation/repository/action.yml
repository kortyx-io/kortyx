name: Validate repository
description: Run one independent repository validation suite.
inputs:
  suite:
    description: coverage, integration, build-typecheck, static, or security
    required: true
  registry-url:
    description: Optional npm registry URL
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Node and pnpm
      uses: ./.github/automation/.github/actions/setup/node
      with:
        registry-url: ${{ inputs.registry-url }}
    - name: Start Redis
      if: inputs.suite == 'coverage' || inputs.suite == 'integration'
      uses: ./.github/automation/.github/actions/setup/redis
    - name: Start PostgreSQL
      if: inputs.suite == 'coverage' || inputs.suite == 'integration'
      uses: ./.github/automation/.github/actions/setup/postgres
    - name: Detect affected packages
      if: inputs.suite != 'static'
      run: pnpm turbo ls --affected --output=json > "$RUNNER_TEMP/kortyx-affected.json"
      shell: bash
    - name: Test with coverage gates
      if: inputs.suite == 'coverage'
      run: pnpm turbo run coverage --affected
      shell: bash
    - name: Build
      if: inputs.suite == 'integration' || inputs.suite == 'build-typecheck'
      run: pnpm turbo run build --affected
      shell: bash
    - name: Telemetry pricing and projection regressions
      if: inputs.suite == 'integration'
      run: |-
        if jq -e '.packages.items | map(.name) | any(. == "@kortyx/telemetry-db")' "$RUNNER_TEMP/kortyx-affected.json" >/dev/null; then
          pnpm --filter @kortyx/telemetry-db db:check
          pnpm --filter @kortyx/telemetry-db db:migrate
          pnpm --filter @kortyx/telemetry-db test
        else
          echo "Skipping unaffected telemetry database regressions."
        fi
      shell: bash
      env:
        DATABASE_URL: ${{ env.KORTYX_TEST_POSTGRES_URL }}
    - name: PostgreSQL runtime persistence integration coverage
      if: inputs.suite == 'integration'
      run: |-
        if jq -e '.packages.items | map(.name) | any(. == "@kortyx/runtime")' "$RUNNER_TEMP/kortyx-affected.json" >/dev/null; then
          pnpm --filter @kortyx/runtime test:integration:postgres
        else
          echo "Skipping unaffected runtime persistence regressions."
        fi
      shell: bash
    - name: Studio unit regressions
      if: inputs.suite == 'integration'
      run: |-
        if jq -e '.packages.items | map(.name) | any(. == "kortyx-studio")' "$RUNNER_TEMP/kortyx-affected.json" >/dev/null; then
          pnpm --filter kortyx-studio test
          pnpm --filter kortyx-studio test:auth-adapter
        else
          echo "Skipping unaffected Studio unit regressions."
        fi
      shell: bash
    - name: API security extension regressions
      if: inputs.suite == 'integration'
      run: |-
        if jq -e '.packages.items | map(.name) | any(. == "@kortyx/api")' "$RUNNER_TEMP/kortyx-affected.json" >/dev/null; then
          DATABASE_URL="$KORTYX_TEST_POSTGRES_URL" pnpm --filter @kortyx/telemetry-db db:migrate
          DATABASE_URL="$KORTYX_TEST_POSTGRES_URL" pnpm --filter @kortyx/api test
          pnpm --filter @kortyx/api test:security-adapter
        else
          echo "Skipping unaffected API security regressions."
        fi
      shell: bash
    - name: Example workflow and error regressions
      if: inputs.suite == 'integration'
      run: |-
        mapfile -t examples < <(jq -r '.packages.items[] | select(.path | startswith("examples/")) | .name' "$RUNNER_TEMP/kortyx-affected.json")
        if [ "${#examples[@]}" -eq 0 ]; then
          echo "Skipping unaffected example regressions."
        else
          filters=()
          for package in "${examples[@]}"; do filters+=(--filter "$package"); done
          pnpm -r --no-bail "${filters[@]}" test
        fi
      shell: bash
    - name: Typecheck
      if: inputs.suite == 'build-typecheck'
      run: pnpm turbo run type-check --affected
      shell: bash
    - name: Studio release publication regressions
      if: inputs.suite == 'static'
      run: |-
        python3 -m unittest discover -s ./.github/automation/.github/scripts/studio/update-channel -v
        python3 -m unittest discover -s ./.github/automation/.github/scripts/tests -v
        node --test ./.github/automation/.github/scripts/tests/*.test.cjs
      shell: bash
    - name: Lint
      if: inputs.suite == 'static'
      run: pnpm lint
      shell: bash
    - name: Audit production dependencies
      if: inputs.suite == 'security'
      run: pnpm audit:prod
      shell: bash
    - name: Initialize CodeQL
      if: inputs.suite == 'security'
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: javascript-typescript
        build-mode: none
    - name: Analyze JavaScript and TypeScript
      if: inputs.suite == 'security'
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
    - name: Scan dependencies, secrets, and infrastructure configuration
      if: inputs.suite == 'security'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: misconfig,secret
        skip-dirs: "**/node_modules,**/.next,**/dist,**/coverage,.git,.turbo"
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: 1
        hide-progress: true
    - name: Generate CycloneDX software bill of materials
      if: inputs.suite == 'security'
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: .
        format: cyclonedx-json
        artifact-name: kortyx-sbom.cdx.json
        output-file: "${{ runner.temp }}/kortyx-sbom.cdx.json"
        upload-artifact-retention: 14
    - name: Stop test databases
      if: always() && (inputs.suite == 'coverage' || inputs.suite == 'integration')
      shell: bash
      run: bash "$ACTION_PATH/../../../scripts/setup/stop-databases.sh"
      env:
        ACTION_PATH: ${{ github.action_path }}
