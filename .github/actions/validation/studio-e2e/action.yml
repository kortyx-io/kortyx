name: Validate Studio E2E
description: Run one isolated Studio database or browser regression partition.

inputs:
  suite:
    description: preflight, standard, reviews, or production
    required: true
  shard:
    description: Optional Playwright shard in current/total form
    required: false
    default: ""
  spec:
    description: Optional Playwright spec file for a production partition
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node and pnpm
      uses: ./.github/automation/.github/actions/setup/node
    - name: Prepare local environment
      run: cp .env.example .env
      shell: bash
    - name: Build database dependencies
      run: pnpm turbo run build --filter=@kortyx/telemetry-db
      shell: bash
    - name: Migrate and bootstrap database
      run: |
        pnpm db:migrate
        KORTYX_STUDIO_ENABLE_EVALS=1 pnpm db:bootstrap
      shell: bash
    - name: Run high-availability and feedback API regressions
      if: inputs.suite == 'preflight'
      run: |
        pnpm --filter @kortyx/telemetry-db test:integration:ha
        pnpm --filter @kortyx/api test:integration:ha
        pnpm --filter @kortyx/api exec vitest run test/scores.integration.test.ts
      shell: bash
    - name: Run persisted eval execution regressions
      if: inputs.suite == 'preflight'
      run: |
        pnpm dev:prepare
        pnpm --filter @kortyx/telemetry-db exec tsx -e 'import postgres from "postgres"; const sql = postgres("postgres://kortyx:kortyx@127.0.0.1:6543/kortyx"); sql.unsafe("CREATE DATABASE kortyx_evals_test").then(() => sql.end());'
        TEST_EVAL_DATABASE_URL=postgres://kortyx:kortyx@127.0.0.1:6543/kortyx_evals_test pnpm --filter @kortyx/api exec vitest run --fileParallelism false test/evals.integration.test.ts test/evaluations.integration.test.ts
      shell: bash
    - name: Verify preinstalled Chromium matches Playwright
      if: inputs.suite != 'preflight' && env.PLAYWRIGHT_IMAGE_VERSION != ''
      run: |
        pnpm --filter kortyx-studio exec node -e '
          const assert = require("node:assert/strict");
          const { existsSync } = require("node:fs");
          const { chromium } = require("@playwright/test");
          assert.equal(require("@playwright/test/package.json").version, process.env.PLAYWRIGHT_IMAGE_VERSION,
            "Update the CI Playwright container alongside the lockfile");
          assert.ok(existsSync(chromium.executablePath()), "Preinstalled Chromium is missing");
        '
      shell: bash
    - name: Install Chromium
      if: inputs.suite != 'preflight' && env.PLAYWRIGHT_IMAGE_VERSION == ''
      run: pnpm --filter kortyx-studio exec playwright install --with-deps chromium
      shell: bash
    - name: Build Studio runtime dependencies
      if: inputs.suite != 'preflight'
      run: pnpm dev:prepare
      shell: bash
    - name: Run standard browser shard
      if: inputs.suite == 'standard'
      env:
        KORTYX_E2E_SHARDED_CI: "1"
        PLAYWRIGHT_SHARD: ${{ inputs.shard }}
      run: pnpm --filter kortyx-studio exec dotenv -e ../../.env -- playwright test --shard="$PLAYWRIGHT_SHARD"
      shell: bash
    - name: Run review-capable feedback regressions
      if: inputs.suite == 'reviews'
      env:
        KORTYX_STUDIO_ENABLE_REVIEWS: "1"
      run: pnpm --filter kortyx-studio exec dotenv -e ../../.env -- playwright test feedback.spec.ts
      shell: bash
    - name: Run production navigation partition
      if: inputs.suite == 'production' && inputs.shard != ''
      env:
        KORTYX_E2E_PRODUCTION: "1"
        KORTYX_E2E_SHARDED_CI: "1"
        PLAYWRIGHT_SPEC: ${{ inputs.spec }}
        PLAYWRIGHT_SHARD: ${{ inputs.shard }}
      run: pnpm --filter kortyx-studio exec dotenv -e ../../.env -- playwright test "$PLAYWRIGHT_SPEC" --shard="$PLAYWRIGHT_SHARD"
      shell: bash
    - name: Run unsharded production navigation partition
      if: inputs.suite == 'production' && inputs.shard == ''
      env:
        KORTYX_E2E_PRODUCTION: "1"
        PLAYWRIGHT_SPEC: ${{ inputs.spec }}
      run: pnpm --filter kortyx-studio exec dotenv -e ../../.env -- playwright test "$PLAYWRIGHT_SPEC"
      shell: bash
    - name: Upload Playwright blob report
      if: inputs.suite != 'preflight' && !cancelled()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: studio-playwright-blob-${{ inputs.suite }}-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: apps/studio/blob-report
        if-no-files-found: error
        retention-days: 1
    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: studio-playwright-failure-${{ inputs.suite }}-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: apps/studio/test-results
        if-no-files-found: ignore
        retention-days: 7
