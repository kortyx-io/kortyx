name: Setup container registry
description: Configure optional emulation, Buildx, and authenticated registry access.

inputs:
  registry:
    description: Container registry
    required: false
    default: ghcr.io
  username:
    description: Registry username
    required: true
  password:
    description: Registry token
    required: true
  qemu:
    description: Enable cross-architecture emulation
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup QEMU
      if: inputs.qemu == 'true'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Login to registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
