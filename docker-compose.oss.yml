name: kortyx-studio

x-usage-env: &usage-env
  KORTYX_USAGE_TELEMETRY_DISABLED: ${KORTYX_USAGE_TELEMETRY_DISABLED:-0}
  KORTYX_USAGE_TELEMETRY_DEBUG: ${KORTYX_USAGE_TELEMETRY_DEBUG:-0}
  KORTYX_USAGE_TELEMETRY_ENDPOINT: ${KORTYX_USAGE_TELEMETRY_ENDPOINT:-}
  KORTYX_USAGE_TELEMETRY_POSTHOG_KEY: ${KORTYX_USAGE_TELEMETRY_POSTHOG_KEY:-}
  KORTYX_USAGE_TELEMETRY_POSTHOG_HOST: ${KORTYX_USAGE_TELEMETRY_POSTHOG_HOST:-}
  KORTYX_USAGE_TELEMETRY_ENVIRONMENT: ${KORTYX_USAGE_TELEMETRY_ENVIRONMENT:-production}
  KORTYX_USAGE_TELEMETRY_TRAFFIC_SOURCE: ${KORTYX_USAGE_TELEMETRY_TRAFFIC_SOURCE:-unknown}
  KORTYX_USAGE_TELEMETRY_ID: ${KORTYX_USAGE_TELEMETRY_ID:-}

x-api-env: &api-env
  DATABASE_URL: postgres://kortyx:${POSTGRES_PASSWORD:-kortyx}@postgres:5432/${POSTGRES_DB:-kortyx}
  KORTYX_API_KEY_PEPPER: ${KORTYX_API_KEY_PEPPER:?KORTYX_API_KEY_PEPPER is required}

x-oss-keys: &oss-keys
  KORTYX_TELEMETRY_API_KEY: ${KORTYX_TELEMETRY_API_KEY:?KORTYX_TELEMETRY_API_KEY is required}
  KORTYX_STUDIO_API_KEY: ${KORTYX_STUDIO_API_KEY:?KORTYX_STUDIO_API_KEY is required}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kortyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kortyx}
    ports:
      - "${KORTYX_POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kortyx-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U kortyx -d $${POSTGRES_DB:-kortyx}",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  db-init:
    image: ${KORTYX_API_IMAGE:-ghcr.io/kortyx-io/kortyx-api}:${KORTYX_STUDIO_IMAGE_TAG:-latest}
    environment:
      <<: [*api-env, *oss-keys]
    command: >
      sh -lc "pnpm --filter @kortyx/telemetry-db db:migrate &&
      pnpm --filter @kortyx/telemetry-db db:bootstrap"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${KORTYX_API_IMAGE:-ghcr.io/kortyx-io/kortyx-api}:${KORTYX_STUDIO_IMAGE_TAG:-latest}
    environment:
      <<: [*api-env, *usage-env]
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 6400
      KORTYX_API_EVAL_WORKER_ENABLED: ${KORTYX_API_EVAL_WORKER_ENABLED:-true}
      KORTYX_EVAL_MAX_CONCURRENT_EVALUATIONS: ${KORTYX_EVAL_MAX_CONCURRENT_EVALUATIONS:-4}
      KORTYX_EVAL_RUN_TIMEOUT_MS: ${KORTYX_EVAL_RUN_TIMEOUT_MS:-1800000}
      KORTYX_EVAL_MAX_RUN_TIMEOUT_MS: ${KORTYX_EVAL_MAX_RUN_TIMEOUT_MS:-2147483647}
      KORTYX_EVAL_JUDGE_MODEL: ${KORTYX_EVAL_JUDGE_MODEL:-}
      KORTYX_EVAL_JUDGE_API_KEY: ${KORTYX_EVAL_JUDGE_API_KEY:-}
      KORTYX_EVAL_JUDGE_API: ${KORTYX_EVAL_JUDGE_API:-responses}
      KORTYX_EVAL_JUDGE_BASE_URL: ${KORTYX_EVAL_JUDGE_BASE_URL:-}
      KORTYX_EVAL_JUDGE_ID: ${KORTYX_EVAL_JUDGE_ID:-}
      KORTYX_EVAL_JUDGE_VERSION: ${KORTYX_EVAL_JUDGE_VERSION:-}
    stop_grace_period: ${KORTYX_API_STOP_GRACE_PERIOD:-30s}
    ports:
      - "${KORTYX_API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-6400}:6400"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:6400/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  studio:
    image: ${KORTYX_STUDIO_IMAGE:-ghcr.io/kortyx-io/kortyx-studio}:${KORTYX_STUDIO_IMAGE_TAG:-latest}
    environment:
      <<: *usage-env
      NODE_ENV: production
      PORT: 6300
      KORTYX_API_URL: http://api:6400
      KORTYX_STUDIO_API_KEY: ${KORTYX_STUDIO_API_KEY:?KORTYX_STUDIO_API_KEY is required}
      KORTYX_STUDIO_AUTH_MODE: ${KORTYX_STUDIO_AUTH_MODE:-basic}
      KORTYX_STUDIO_BASIC_AUTH_USERNAME: ${KORTYX_STUDIO_BASIC_AUTH_USERNAME:-admin}
      KORTYX_STUDIO_BASIC_AUTH_PASSWORD: ${KORTYX_STUDIO_BASIC_AUTH_PASSWORD:?KORTYX_STUDIO_BASIC_AUTH_PASSWORD is required}
    ports:
      - "${KORTYX_STUDIO_BIND_ADDRESS:-127.0.0.1}:${STUDIO_PORT:-6300}:6300"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:6300').then((r)=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  smoke:
    image: ${KORTYX_API_IMAGE:-ghcr.io/kortyx-io/kortyx-api}:${KORTYX_STUDIO_IMAGE_TAG:-latest}
    profiles: ["smoke"]
    environment:
      KORTYX_API_URL: http://api:6400
      <<: *oss-keys
    command: pnpm --filter @kortyx/api smoke:telemetry
    depends_on:
      api:
        condition: service_healthy
      studio:
        condition: service_healthy
    restart: "no"

volumes:
  kortyx-postgres:
